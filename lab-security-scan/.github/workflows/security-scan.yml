name: AppSec Lab — Crypto & Data Protection Scan

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  bandit:
    name: Bandit — Python SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit (JSON report)
        run: |
          bandit -r lab/ \
            -t B105,B106,B107,B303,B324,B501,B601 \
            --severity-level medium \
            -f json -o bandit-report.json || true

      - name: Run Bandit (console output)
        run: |
          bandit -r lab/ \
            -t B105,B106,B107,B303,B324,B501,B601 \
            --severity-level medium || true

      # Rule reference:
      # B303/B324 = weak hash (MD5/SHA1)
      # B105/B106/B107 = hardcoded passwords
      # B501 = weak TLS config
      # B601 = shell injection

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  semgrep:
    name: Semgrep — Tokenless SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep (JSON report)
        run: |
          semgrep scan \
            --config "p/python" \
            --config "p/secrets" \
            --config "p/owasp-top-ten" \
            lab/ \
            --json --output semgrep-report.json || true

      - name: Run Semgrep (console output)
        run: |
          semgrep scan \
            --config "p/python" \
            --config "p/secrets" \
            --config "p/owasp-top-ten" \
            lab/ || true

      # No SEMGREP_APP_TOKEN needed — uses public Community Edition rulesets

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

  summary:
    name: Findings Summary
    runs-on: ubuntu-latest
    needs: [bandit, semgrep]
    if: always()
    steps:
      - name: Download Bandit report
        uses: actions/download-artifact@v4
        with:
          name: bandit-report
          path: ./reports

      - name: Download Semgrep report
        uses: actions/download-artifact@v4
        with:
          name: semgrep-report
          path: ./reports

      - name: Write GitHub Actions summary
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Rulesets | Report |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit | B303, B324, B105-107, B501, B601 | bandit-report.json |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep | p/python, p/secrets, p/owasp-top-ten | semgrep-report.json |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download artifacts above to review full JSON findings." >> $GITHUB_STEP_SUMMARY
